# HarpreetLinux installer disk layout. Disk encryption (LUKS) is offered on the partition page.
---
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 300MiB
userSwapChoices:
    - none
    - small
    - suspend
    - file
initialPartitioningChoice: erase
initialSwapChoice: small
drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
defaultFileSystemType: "ext4"
availableFileSystemTypes: ["ext4"]
# Show the "Encrypt system" box for automatic partitioning.
enableLuksAutomatedPartitioning: true
# GRUB cannot open LUKS2 drives that use argon2, so create LUKS1.
luksGeneration: luks1
