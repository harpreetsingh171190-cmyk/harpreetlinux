name: Build live ISO

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  iso:
    name: Build bootable ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost
          df -h /

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso mtools \
            grub-pc-bin grub-efi-amd64-bin

      - name: Build live ISO
        run: bash scripts/build_iso.sh

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: live-iso
          path: out/
          retention-days: 14
          if-no-files-found: error
