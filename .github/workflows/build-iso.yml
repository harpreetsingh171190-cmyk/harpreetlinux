name: Build live ISO
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Choose minimal CLI or XFCE desktop'
        type: choice
        options: [minimal, desktop]
        default: minimal
      flavor:
        description: 'Desktop flavour'
        type: choice
        options: [xfce, lxqt, mate, gnome, kde]
        default: xfce
permissions:
  contents: read
jobs:
  iso:
    name: Build and boot-test ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost
          df -h /
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap debian-archive-keyring squashfs-tools xorriso mtools zstd \
            grub-pc-bin grub-efi-amd64-bin grub-common qemu-system-x86
          test -s /usr/share/keyrings/debian-archive-keyring.gpg
      - name: Restore base system cache
        uses: actions/cache@v4
        with:
          path: cache
          key: rootfs-${{ inputs.profile || 'minimal' }}-${{ inputs.flavor || 'xfce' }}-v3-${{ hashFiles('distro.conf') }}

      - name: Build ISO
        env:
          PROFILE: ${{ inputs.profile || 'minimal' }}
          FLAVOR: ${{ inputs.flavor || 'xfce' }}
        run: bash scripts/build_iso.sh
      - name: Boot test
        timeout-minutes: 12
        env:
          BOOT_TIMEOUT: '540'
        run: bash scripts/test_iso.sh
      - name: Upload ISO and test logs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: live-iso-${{ inputs.flavor || 'xfce' }}
          path: out/
          retention-days: 14
          if-no-files-found: warn
      - name: Show bootstrap and package logs on failure
        if: failure()
        run: |
          for log in build-iso/rootfs/debootstrap/debootstrap.log build-iso/rootfs/var/log/apt/term.log build-iso/rootfs/var/log/dpkg.log; do
            if [ -f "$log" ]; then
              echo "===== $log ====="
              sudo tail -n 150 "$log"
            fi
          done
      - name: Upload diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            build-iso/rootfs/debootstrap/debootstrap.log
            build-iso/rootfs/var/log/apt/term.log
            build-iso/rootfs/var/log/dpkg.log
            out/boot-test.log
          retention-days: 7
          if-no-files-found: warn
