name: Build live ISO

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "minimal = command line only, desktop = XFCE + tools"
        type: choice
        options: [desktop, minimal]
        default: desktop

permissions:
  contents: read

jobs:
  iso:
    name: Build and boot-test ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost
          df -h /

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso mtools \
            grub-pc-bin grub-efi-amd64-bin qemu-system-x86

      - name: Build live ISO
        env:
          PROFILE: ${{ inputs.profile || 'desktop' }}
        run: bash scripts/build_iso.sh

      - name: Boot test in QEMU
        run: bash scripts/test_iso.sh

      - name: Upload ISO
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-iso
          path: out/
          retention-days: 14
          if-no-files-found: error

      - name: Show debootstrap log on failure
        if: failure()
        run: |
          LOG="build-iso/rootfs/debootstrap/debootstrap.log"
          if [ -f "$LOG" ]; then
            echo "===== Last 120 lines of $LOG ====="
            sudo tail -n 120 "$LOG"
            echo "===== Error lines ====="
            sudo grep -iE "error|E:|fail|dpkg|postinst|returned" "$LOG" | tail -n 60 || true
          else
            echo "No debootstrap log found at $LOG"
          fi

      - name: Upload debootstrap log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debootstrap-log
          path: build-iso/rootfs/debootstrap/debootstrap.log
          retention-days: 7
          if-no-files-found: warn
