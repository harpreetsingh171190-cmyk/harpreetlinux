# Settings for the distro. Change these values to rename or retarget the build.
# Do not use the names "Debian" or "Ubuntu" for a derivative distro:
# both projects restrict the use of their trademarks.
NAME="HarpreetLinux"
NAME_LOWER="harpreetlinux"
SUITE="trixie"
MIRROR="http://deb.debian.org/debian"
PACKAGES="systemd-sysv,udev,dbus,adduser,sudo,ca-certificates,less,nano,openssh-client,iproute2,locales"

# Extra packages for every ISO: kernel, live boot support, networking.
ISO_PACKAGES="linux-image-amd64,initramfs-tools,live-boot,live-config,live-config-systemd,user-setup,network-manager,wpasupplicant,iputils-ping,firmware-realtek,curl,wget,git"

# Lightweight desktop included in EVERY ISO: Openbox window manager, panel, terminal,
# login screen, and a Wi-Fi tray applet. Keeps the image small compared with XFCE.
LIGHT_DESKTOP_PACKAGES="xorg,lightdm,lightdm-gtk-greeter,xfce4,xfce4-terminal,thunar,xfce4-power-manager,xfce4-screenshooter,xfce4-notifyd,network-manager-gnome,mousepad,ristretto,parole,xarchiver,firefox-esr,pavucontrol,pipewire-audio,wireplumber,adwaita-icon-theme,fonts-dejavu-core,fonts-noto-core,dbus-x11,xterm,udisks2,gvfs,gvfs-backends,gvfs-fuse,thunar-volman,polkitd,pkexec,exfatprogs,ntfs-3g,dosfstools,papirus-icon-theme,arc-theme,fonts-noto,fonts-liberation"
# Everyday tools included in every ISO, grouped by purpose.
# Note: Debian names differ from some upstream names:
#   NetworkManager -> network-manager, linux-firmware -> firmware-linux (+ firmware-misc-nonfree)
NET_TOOLS="network-manager,wpasupplicant,iw,rfkill,ethtool"
FIRMWARE_TOOLS="firmware-linux,firmware-misc-nonfree,fwupd"
INTERNET_TOOLS="curl,wget,ca-certificates,dnsutils,iputils-ping,net-tools,traceroute,mtr-tiny,nmap,openssh-client"
FS_TOOLS="ntfs-3g,exfatprogs,dosfstools"
HARDWARE_TOOLS="pciutils,usbutils,lshw,inxi"
MONITOR_TOOLS="btop,htop,lm-sensors,smartmontools,ncdu,iotop"
TERMINAL_TOOLS="bash-completion,nano,vim,tmux,tree,file,less"
SECURITY_TOOLS="ufw,apparmor,apparmor-utils,gnupg,debsums,needrestart,unattended-upgrades"
RECOVERY_TOOLS="testdisk,gparted,parted,rsync"
COMPRESS_TOOLS="unzip,zip,7zip,tar,zstd"
# Next batch: developer CLI, snapshot backup, laptop power, media codecs.
NEXT_TOOLS="timeshift,tlp,zsh,fzf,ripgrep,bat,fd-find,jq,tealdeer,ffmpeg,gstreamer1.0-libav"
TOOLS_PACKAGES="${NET_TOOLS},${FIRMWARE_TOOLS},${INTERNET_TOOLS},${FS_TOOLS},${HARDWARE_TOOLS},${MONITOR_TOOLS},${TERMINAL_TOOLS},${SECURITY_TOOLS},${RECOVERY_TOOLS},${COMPRESS_TOOLS},git,${NEXT_TOOLS}"

# Added when PROFILE=desktop: a lean XFCE desktop with Wi-Fi support.
DESKTOP_PACKAGES="xorg,dbus-x11,lightdm,xfce4,xfce4-terminal,network-manager-gnome,firmware-iwlwifi,firmware-realtek,firmware-atheros,firmware-brcm80211"

# ---- Desktop flavours (choose one per build with the "flavor" input) ----
# Shared GUI base for every flavour.
COMMON_GUI="xorg,lightdm,lightdm-gtk-greeter,mousepad,ristretto,parole,xarchiver,firefox-esr,pavucontrol,pipewire-audio,wireplumber,adwaita-icon-theme,fonts-dejavu-core,fonts-noto-core,fonts-liberation,dbus-x11,xterm,udisks2,gvfs,gvfs-backends,gvfs-fuse,polkitd,pkexec,exfatprogs,ntfs-3g,dosfstools,papirus-icon-theme,arc-theme,network-manager-gnome,plymouth,calamares,calamares-settings-debian,plank,zenity,gnome-software,gnome-software-plugin-flatpak,packagekit"
# XFCE: light, classic, reliable.
DE_XFCE="xfce4,xfce4-terminal,thunar,thunar-volman,xfce4-power-manager,xfce4-screenshooter,xfce4-notifyd"
# LXQt: lightest Qt desktop.
DE_LXQT="lxqt-core,pcmanfm-qt,qterminal,lxqt-policykit,openbox"
# MATE: traditional GNOME 2 style.
DE_MATE="mate-desktop-environment-core,mate-terminal,caja"
# GNOME: modern, largest.
DE_GNOME="gnome-session,gnome-shell,gnome-terminal,nautilus,gnome-control-center,gnome-tweaks"
# KDE Plasma (X11 session): modern and feature-rich, large.
DE_KDE="plasma-desktop,plasma-workspace,kwin-x11,konsole,dolphin,plasma-nm,plasma-pa,plasma-discover"

# Extra desktop applications (installed with every flavour).
# LibreOffice is trimmed to the main apps to keep the ISO smaller.
# gnome-disk-utility can write ISO images to USB (Debian has no usb-creator).
# Desktop applications per flavour. Each flavour gets the apps that fit its size and style.
GUI_XFCE="xfce4-taskmanager,bleachbit,remmina,cups,blueman,flatpak,gnome-disk-utility"
GUI_LXQT="qps,bleachbit,remmina,cups,blueman,flatpak"
GUI_MATE="mate-system-monitor,bleachbit,remmina,cups,blueman,flatpak,libreoffice-writer,libreoffice-calc,libreoffice-gtk3"
GUI_GNOME="gnome-system-monitor,bleachbit,remmina,cups,blueman,flatpak,gnome-disk-utility,libreoffice-writer,libreoffice-calc,libreoffice-gtk3"
GUI_KDE="plasma-systemmonitor,bleachbit,remmina,cups,blueman,flatpak,libreoffice-writer,libreoffice-calc,libreoffice-gtk3"

# ---- Editions (choose with the "edition" input; "none" adds nothing) ----
# Security Edition: candidate packages. The build checks each one against the
# Debian archive and SKIPS any that do not exist (for example Metasploit, Burp Suite,
# Nuclei, VeraCrypt), writing the skipped names to
# /usr/share/harpreetlinux-security-skipped.txt inside the image.
# For learning and authorized testing only.
SECURITY_EDITION="gobuster,dirb,ffuf,wfuzz,nikto,sqlmap,zaproxy,burpsuite,nuclei,exploitdb,metasploit-framework,john,hashcat,hydra,medusa,aircrack-ng,kismet,wifite,reaver,bettercap,bluez,bluez-tools,ghidra,radare2,gdb,valgrind,binwalk,binutils,bsdextrautils,apktool,jadx,android-tools-adb,theharvester,recon-ng,spiderfoot,zeek,suricata,wireshark,tshark,tcpdump,ngrep,sleuthkit,autopsy,foremost,scalpel,gddrescue,hashdeep,yara,clamav,libimobiledevice-utils,volatility3,tor,torsocks,onionshare,proxychains4,firejail,libimage-exiftool-perl,mat2,cryptsetup,veracrypt"

# ---- Branding ----
# Boot splash (Plymouth) with the HarpreetLinux logo. Set to "no" if it ever causes boot problems.
BOOT_SPLASH="yes"
VERSION_LABEL="0.2"
