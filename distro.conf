# Settings for the distro. Change these values to rename or retarget the build.
# Do not use the names "Debian" or "Ubuntu" for a derivative distro:
# both projects restrict the use of their trademarks.
NAME="HarpreetLinux"
NAME_LOWER="harpreetlinux"
SUITE="trixie"
MIRROR="http://deb.debian.org/debian"
PACKAGES="systemd-sysv,udev,dbus,adduser,sudo,ca-certificates,less,nano,openssh-client,iproute2,locales"

# Extra packages for every ISO: kernel, live boot support, networking.
ISO_PACKAGES="linux-image-amd64,initramfs-tools,live-boot,live-config,live-config-systemd,user-setup,network-manager,wpasupplicant,iputils-ping,firmware-realtek,curl,wget,git"

# Lightweight desktop included in EVERY ISO: Openbox window manager, panel, terminal,
# login screen, and a Wi-Fi tray applet. Keeps the image small compared with XFCE.
LIGHT_DESKTOP_PACKAGES="xorg,lightdm,lightdm-gtk-greeter,xfce4,xfce4-terminal,thunar,xfce4-power-manager,xfce4-screenshooter,xfce4-notifyd,network-manager-gnome,mousepad,ristretto,parole,xarchiver,firefox-esr,pavucontrol,pipewire-audio,wireplumber,adwaita-icon-theme,fonts-dejavu-core,fonts-noto-core,dbus-x11,xterm"
# Everyday tools included in every ISO.
TOOLS_PACKAGES="htop,nano,vim-tiny,unzip,zip,p7zip-full,tree,file,less,bash-completion,iputils-ping,dnsutils,net-tools,usbutils,pciutils,wget,curl,git"

# Added when PROFILE=desktop: a lean XFCE desktop with Wi-Fi support.
DESKTOP_PACKAGES="xorg,dbus-x11,lightdm,xfce4,xfce4-terminal,network-manager-gnome,firmware-iwlwifi,firmware-realtek,firmware-atheros,firmware-brcm80211"
